version: '3.8'

services:
  # PostgreSQL 数据库 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zhida-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-@Value123456}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - zhida-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhida-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-@Value123456}"
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      SEARCH_API_API_KEY: ${SEARCH_API_KEY:-}
      SERVER_PORT: 8123
    ports:
      - "8123:8123"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zhida-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端应用 (使用 Nginx)
  frontend:
    build:
      context: ./zhida-ai-frontend
      dockerfile: Dockerfile
    container_name: zhida-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - zhida-network

volumes:
  postgres_data:
    driver: local

networks:
  zhida-network:
    driver: bridge
